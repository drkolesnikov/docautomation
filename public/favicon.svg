<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Deep navy → clinical teal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Glass highlight on upper half -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft glow behind symbol -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Upper-glass shine -->
  <rect x="2" y="2" width="60" height="28" rx="12" fill="url(#shine)"/>

  <!-- Thin inset border ring -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13"
        fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- ═══ Ψ symbol ═══ -->
  <g filter="url(#glow)" stroke="white" stroke-linecap="round" fill="none">
    <!-- Left outer prong -->
    <line x1="16" y1="12" x2="16" y2="33" stroke-width="5"/>
    <!-- Centre prong (taller) -->
    <line x1="32" y1="9"  x2="32" y2="33" stroke-width="5"/>
    <!-- Right outer prong -->
    <line x1="48" y1="12" x2="48" y2="33" stroke-width="5"/>
    <!-- Horizontal crossbar -->
    <line x1="13.5" y1="33" x2="50.5" y2="33" stroke-width="4.5"/>
    <!-- Stem -->
    <line x1="32" y1="36" x2="32" y2="54" stroke-width="5"/>
  </g>
</svg>
